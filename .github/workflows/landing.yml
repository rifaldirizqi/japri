# Deploy landing page (folder site/) ke VPS lewat SSH + rsync, tiap ada perubahan di site/.
# Setup sekali di VPS & GitHub Secrets: lihat docs/DEPLOY-LANDING.md
name: Landing page

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/landing.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: landing
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      SITE_URL: https://japri.rifaldirizqi.web.id/
    steps:
      - uses: actions/checkout@v5

      - name: Cek secrets
        run: |
          for v in VPS_HOST VPS_USER VPS_SSH_KEY VPS_KNOWN_HOSTS; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v belum diisi. Lihat docs/DEPLOY-LANDING.md"; exit 1; fi
          done

      - name: Siapin SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload ke VPS
        # Key di VPS dibatasi rrsync ke /var/www/japri, jadi tujuan ":" = folder itu
        run: |
          rsync -rz --delete --chmod=D755,F644 \
            -e "ssh -p ${VPS_PORT:-22} -i $HOME/.ssh/deploy_key -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes" \
            site/ "$VPS_USER@$VPS_HOST:"

      - name: Cek halaman online
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 5 "$SITE_URL")
          echo "$SITE_URL → HTTP $code"
          [ "$code" = "200" ] || { echo "::error::$SITE_URL ngebales HTTP $code"; exit 1; }

      - name: Hapus key
        if: always()
        run: rm -f ~/.ssh/deploy_key
