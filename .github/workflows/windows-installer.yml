# Build installer Windows (JapriSetup-<versi>.exe).
# - Tiap push tag v* (mis. v0.1.0): installer ditempel ke GitHub Release versi itu.
# - Bisa juga dijalanin manual dari tab Actions buat ngetes; hasilnya ada di bagian Artifacts.
name: Windows installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write # buat manggil workflow landing

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache: false

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Cek versi tag & ambil catatan rilis dari CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$pkg" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} beda sama versi package.json ($pkg)" }
          $changelog = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($changelog, "(?ms)^## \[$([regex]::Escape($pkg))\][^\n]*\n(.*?)(?=^## \[|\z)")
          if (-not $m.Success -or -not $m.Groups[1].Value.Trim()) { throw "CHANGELOG.md belum punya bagian ## [$pkg]" }
          $m.Groups[1].Value.Trim() | Set-Content -Encoding utf8 "$env:RUNNER_TEMP\notes.md"

      - name: Build installer
        shell: pwsh
        run: ./packaging/windows/build.ps1

      - uses: actions/upload-artifact@v5
        with:
          name: JapriSetup
          path: dist/JapriSetup-*.exe

      - name: Tempel ke GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $file = Get-ChildItem dist/JapriSetup-*.exe | Select-Object -First 1
          gh release view "${{ github.ref_name }}" 2>$null
          if ($LASTEXITCODE) {
            gh release create "${{ github.ref_name }}" --title "Japri ${{ github.ref_name }}" --notes-file "$env:RUNNER_TEMP\notes.md"
          }
          gh release upload "${{ github.ref_name }}" $file.FullName --clobber

      - name: Perbarui latest.json di landing page
        # Workflow landing yang bikin latest.json (versi, link & checksum installer) dari rilis ini.
        # Dipanggil manual karena rilis yang dibikin GITHUB_TOKEN gak memicu workflow lain.
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run landing.yml --ref main
