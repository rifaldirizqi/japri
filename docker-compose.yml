services:
  japri:
    image: ghcr.io/rifaldirizqi/japri:latest
    # Mau build sendiri dari kode di folder ini? Ganti baris image di atas jadi:  build: .
    restart: unless-stopped
    stdin_open: true   # buat wizard setup
    tty: true
    volumes:
      - ./data:/data   # session WA, database, & pengaturan
    extra_hosts:
      - "host.docker.internal:host-gateway"   # biar bisa akses Ollama/LM Studio di PC yang sama
